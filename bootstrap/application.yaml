apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hyper-gitops-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TU_USUARIO/hyper-gitops-lab.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: hyper-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
