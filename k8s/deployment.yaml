apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyper-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hyper-web
  template:
    metadata:
      labels:
        app: hyper-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: web-content
          configMap:
            name: hyper-web-content
