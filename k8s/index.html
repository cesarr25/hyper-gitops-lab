<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyper · GitOps Lab</title>
  <style>
    :root {font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f7fafc;background:#0b1220}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:36px 18px;background:radial-gradient(circle at 15% 15%,#233e64 0,transparent 42%),#0b1220}
    main{width:min(880px,100%);text-align:center} .eyebrow{color:#93c5fd;font-size:14px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
    h1{font-size:clamp(36px,7vw,72px);letter-spacing:-.045em;margin:12px 0}p{color:#bac7d9;font-size:18px;margin-bottom:34px}
    .gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
    figure{margin:0;background:#172337;border:1px solid #30425c;border-radius:20px;padding:15px;box-shadow:0 18px 40px #0005}
    img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#fff}
    figcaption{font-weight:700;margin:14px 0 3px;font-size:18px}footer{color:#90a2bd;margin-top:32px;font-size:13px}
    @media(max-width:540px){.gallery{grid-template-columns:1fr}figure{max-width:380px;margin:auto;width:100%}}
  </style>
</head>
<body>
<main>
  <h1>Hola equipo de hyper,</h1>
  <section class="gallery" aria-label="Galería de imágenes">
    <figure><img src="/perrito.png" alt="Perrito blanco sonriendo"><figcaption></figcaption></figure>
    <figure><img src="/tortuga.png" alt="Tortuga animada"><figcaption></figcaption></figure>
  </section>
</main>
</body>
</html>
